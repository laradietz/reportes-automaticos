name: Reportes automáticos

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 10 * * 1-5"   # días hábiles, 10:00 UTC (07:00 Argentina)
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests (SQLite y PostgreSQL)
        run: pytest -q
      - name: Pipeline completo sobre SQLite
        run: python -m reportes ejecutar --regenerar
      - name: Pipeline completo sobre PostgreSQL
        run: python -m reportes --db-url "$PG_URL" ejecutar
      - name: Carga incremental sobre PostgreSQL
        run: |
          python -m reportes agregar-novedades --filas 300
          python -m reportes --db-url "$PG_URL" etl --incremental
      - name: Publicar reportes como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            output/
            logs/pipeline.log
