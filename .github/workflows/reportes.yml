name: Reportes automáticos

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 10 * * 1-5"   # días hábiles, 10:00 UTC (07:00 Argentina)
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Ejecutar pipeline (ETL + reportes)
        run: python -m reportes ejecutar --regenerar
      - name: Publicar reportes como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            output/
            logs/pipeline.log
