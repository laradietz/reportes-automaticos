[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reportes-automaticos"
version = "1.0.0"
description = "Pipeline ETL (Python + SQL) que extrae, procesa y genera reportes automáticamente"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
reportes = "reportes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
